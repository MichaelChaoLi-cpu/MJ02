analysisStructureBrief:
  overview: >-
    The study centers a reproduced historical Southwest-West repression boundary and asks whether
    assignment to the more repressive side durably amplifies local rainfall sensitivity. The
    primary outcome is annual land NPP and observed VIIRS nighttime activity supplies an independent
    outcome validation. Outcome-blind power, a 0.20-SD SESOI, a frozen 5 km window, and a mandatory
    within-modern-commune confirmation distinguish a bounded null from an underpowered null.
    Completed national survey, flood, price, and mechanism analyses bound generalization and
    interpretation but do not provide co-equal headline estimands.
  levels:
    - levelName: Central historical-boundary identification gate
      levelAim: Reproduce the historical assignment and establish support, continuity, effective power, and modern-boundary safeguards before outcome interpretation.
      inputs:
        - Assignment to the more repressive historical Southwest zone
        - Signed distance to the Southwest-West historical boundary
        - Historical boundary segment identifier
        - Five-kilometre historical-boundary common support
        - May-October standardized rainfall anomaly
      modelOrMethod: >-
        Treatment side, signed distance, and five segment assignments are independently reproduced.
        The frozen local design audits density and predetermined continuity, simulates effective-unit
        80 percent MDEs, fixes a 0.20-SD SESOI and 5 km primary window, and requires a confirmation
        sample restricted to modern climate communes containing observations on both historical sides.
      outputs:
        - Historical repression boundary design
        - Historical boundary linkage and power
        - Boundary support, power, and continuity
        - Geographic identification and falsification checks
        - Prospective decisions and deviations
      interpretation: >-
        Exact reproduction and power below the SESOI permit outcome estimation. Modern commune
        proximity is handled through the mandatory confirmation rather than assumed away; causal
        interpretation remains local to the historical boundary and conditional on continuity.
    - levelName: Central land-NPP rainfall-sensitivity test
      levelAim: Estimate whether higher historical repression changes annual land-production sensitivity to rainfall near the boundary.
      inputs:
        - Annual local land net primary production anomaly
        - Standardized annual local land NPP anomaly
        - Assignment to the more repressive historical Southwest zone
        - Signed distance to the Southwest-West historical boundary
        - Historical boundary segment identifier
        - May-October standardized rainfall anomaly
        - Mean share of growing-season days using gap-filled NPP inputs
        - Log one plus historical distance to the nearest mapped river
      modelOrMethod: >-
        For village v and year t, A_vt = alpha_v + lambda_s(v)t + beta S_c(v)t +
        theta[R_v x S_c(v)t] + eta_0[d_v x S_c(v)t] + eta_1[R_v x d_v x S_c(v)t] + epsilon_vt.
        The primary model uses equal village-year weights within 5 km and two-way village plus
        district-year clustering. The mandatory confirmation adds climate-commune-by-year fixed
        effects; frozen bandwidth, annual-rainfall, standardized-outcome, river-distance, quality,
        and segment sensitivities evaluate stability and equivalence.
      outputs:
        - Historical repression and rainfall sensitivity
        - Historical boundary rainfall-response estimates
      interpretation: >-
        Primary and confirmation estimates are small, mutually compatible, and have standardized
        confidence intervals inside the pre-specified equivalence bounds. This supports a local
        bounded null for land-NPP rainfall sensitivity, not absence of a level legacy or a national effect.
    - levelName: Independent nighttime-activity validation
      levelAim: Test the compatible local rainfall-sensitivity estimand in an independent outcome measurement system.
      inputs:
        - Inverse-hyperbolic-sine annual mean nighttime radiance
        - Inverse-hyperbolic-sine annual median nighttime radiance
        - Any detected nonzero annual mean nighttime radiance
        - Annual cloud-free VIIRS observation count
        - Assignment to the more repressive historical Southwest zone
        - Signed distance to the Southwest-West historical boundary
        - May-October standardized rainfall anomaly
      modelOrMethod: >-
        For grid cell p and year t, Y_pt uses the same treatment-by-rainfall, signed-distance,
        side-specific rainfall trend, and segment-by-year structure as the land-NPP model, with
        grid-cell and district-year clustered inference. The mandatory within-commune model and
        frozen outcome, coverage, weighting, rainfall, and bandwidth checks use the same 0.20-SD
        equivalence standard on a pooled within-cell scale.
      outputs:
        - Nighttime activity independent validation
        - Nighttime activity validation estimates
      interpretation: >-
        Compatible bounded-null estimates across NPP and observed VIIRS reduce concern that the
        central result is specific to one sensor or outcome scale. They do not establish household
        welfare effects or national transport.
    - levelName: Supporting exposure support and linkage audit
      levelAim: Establish whether each conflict and shock measure has adequate spatial and temporal overlap before outcome estimation.
      inputs:
        - Log bombing-location density
        - Interview-aligned twelve-month Standardized Precipitation Index
        - Annual extreme-wet rainfall indicator
        - Twelve-month change in local wholesale rice price pressure
        - Household survey weight
        - Person survey weight
      modelOrMethod: >-
        Unweighted and survey-weighted coverage shares, PSU and province counts, exposure
        distributions, geography maps, and conflict-tercile overlap diagnostics are calculated
        separately for each shock-specific analytical support. Missing exposure is never coded as
        zero.
      outputs:
        - Shock-specific analytical support
      interpretation: >-
        Conflict and annual rainfall are fully linked, while drought, price, and satellite samples
        are narrower. Estimation is feasible with shock-specific denominators, but cross-shock
        comparisons cannot be treated as a balanced full-period design.
    - levelName: Supporting adjusted baseline historical legacy
      levelAim: Test whether conflict-exposed places show persistent conditional disadvantages outside the interaction estimand.
      inputs:
        - Log bombing-location density
        - Agriculture, consumption, food-security, and education outcomes
        - Household-member count
        - Age in completed years
        - Female indicator
        - Household survey weight
        - Person survey weight
      modelOrMethod: >-
        The descriptive baseline model is Y_igpt = rho C_g + delta_pt + X_igpt' gamma + epsilon_igpt,
        where province-by-wave fixed effects absorb shared province-time conditions and standard
        errors are clustered by linked historical geography. Because geography fixed effects would
        absorb C_g, rho is a conditional association rather than a causal conflict effect.
      outputs:
        - Mechanisms and national generalization
      interpretation: >-
        Adjusted associations are small and mixed rather than a coherent cross-domain disadvantage
        gradient. Isolated coefficients do not establish a general persistent development legacy.
    - levelName: Supporting national conflict-conditioned shock responses
      levelAim: Estimate whether drought, extreme-wet rainfall, and local food-price shocks have different effects at higher historical-conflict exposure.
      inputs:
        - Log bombing-location density
        - Interview-aligned twelve-month Standardized Precipitation Index
        - Annual extreme-wet rainfall indicator
        - Twelve-month change in local wholesale rice price pressure
        - Agriculture, consumption, food-security, and education outcomes
        - Household and person controls and survey weights
      modelOrMethod: >-
        For shock family k, the model is Y_igpt^(k) = alpha_g + delta_pt + theta_k S_gt^(k) +
        beta_k(C_g x S_gt^(k)) + X_igpt' gamma_k + epsilon_igpt^(k). Historical-geography and
        province-by-wave fixed effects are absorbed, continuous conflict and shocks are standardized
        over relevant support, and beta_k measures differential shock sensitivity. Binary outcomes
        use weighted linear probability models and skewed nonnegative outcomes use inverse
        hyperbolic sine transformations in the primary specification.
      outputs:
        - Cross-domain conflict-shock amplification estimates
        - Main conflict-by-shock estimates
      interpretation: >-
        Drought and extreme-wet interactions are generally imprecise. The adverse attendance-price
        interaction is precise under the primary definitions, but broad amplification across shocks
        and outcome domains is not supported and the coefficient is not a causal conflict effect.
    - levelName: Supporting adaptation mechanisms and heterogeneity
      levelAim: Assess whether adaptive capacity or agricultural dependence aligns with the proposed resilience pathway.
      inputs:
        - Irrigable parcel share
        - Number of distinct crops
        - Agricultural input costs at 2021 prices
        - Agricultural-household indicator
        - Log bombing-location density
        - Interview-aligned twelve-month Standardized Precipitation Index
      modelOrMethod: >-
        Mechanism outcomes use the main conflict-by-shock specification. Prespecified heterogeneity
        uses the hierarchical model Y = alpha_g + delta_pt + theta S + mu H + beta(C x S) +
        eta(S x H) + phi(C x H) + kappa(C x S x H) + X'gamma + epsilon, retaining every lower-order
        term so kappa is the differential amplification by subgroup.
      outputs:
        - Mechanisms and national generalization
        - Mechanism families and multiplicity checks
      interpretation: >-
        Irrigation is directionally coherent but its mechanism-family Holm-adjusted p-value is
        0.106 under the expanded six-test family. Crop diversity, input cost, and subgroup
        differences are imprecise, no activated mechanism is multiplicity robust, and none of the
        estimates identify causal mediation.
    - levelName: Supporting inference, falsification, and definition robustness
      levelAim: Determine whether supporting national results depend on spatial correlation, multiplicity, timing, functional form, one region, one wave, or one exposure definition.
      inputs:
        - Alternative bombing, prison, and burial-site measures
        - Alternative rainfall windows and price constructions
        - Main outcomes and mechanism outcomes
        - Historical geography and province identifiers
        - Household and person survey weights
      modelOrMethod: >-
        The main interaction model is re-estimated with geography-clustered errors, Spatial-HAC at
        50, 100, and 200 kilometres, 999-draw province wild-bootstrap inference for price models,
        within-family Holm adjustment, future-shock placebos, nonlinear binary and count models,
        alternative fixed effects, commune-only and fallback linkages, weighted and unweighted
        samples, leave-one-province and leave-one-wave exclusions, and upper-tail influence checks.
      outputs:
        - Alternative conflict and shock definitions
        - Inference and multiplicity checks
        - Falsification and functional-form checks
      interpretation: >-
        The attendance-price coefficient survives the primary construction's inference, placebo,
        nonlinear, fixed-effect, and leave-one-out checks, but not alternative conflict and price
        definitions. The defensible conclusion is therefore definition-sensitive and narrower than
        a general resilience effect.
    - levelName: Supporting satellite inundation convergence
      levelAim: Test whether direct inundation evidence agrees with extreme-wet rainfall on a common partial-period sample.
      inputs:
        - Annual extreme-wet rainfall indicator
        - Survey-year maximum flooded geography share
        - Preceding twelve-month maximum flooded geography share
        - Survey-year maximum flood duration
        - Log bombing-location density
        - Crop yield and post-harvest loss
      modelOrMethod: >-
        Rainfall-inundation correspondence is summarized at geography-year level, and the main
        conflict-conditioned interaction model is re-estimated for rainfall and satellite flood
        measures on common 2009-2017 coverage. Permanent water is excluded and post-2018
        noncoverage remains missing.
      outputs:
        - Alternative conflict and shock definitions
      interpretation: >-
        Correspondence is weak and satellite interactions do not reproduce a clear agricultural
        amplification pattern. Flooding remains secondary partial-period validation, not a
        full-period core exposure.
    - levelName: Integrated evidence synthesis
      levelAim: Separate the local identified rainfall-sensitivity conclusion from national breadth, mechanism, and transport evidence.
      inputs:
        - Historical boundary rainfall-response estimates
        - Nighttime activity validation estimates
        - Natural-unit and standardized interaction estimates
        - Adjusted baseline legacy estimates
        - Mechanism-family estimates
        - Robustness and inference diagnostics
      modelOrMethod: >-
        Evidence is ordered by identification strength without coefficient pooling. The local NPP
        and VIIRS estimates use the frozen boundary, confirmation, and equivalence contract;
        national household interactions and six-test mechanisms are interpreted only as supporting
        evidence on breadth and possible channels.
      outputs:
        - Historical repression and rainfall sensitivity
        - Nighttime activity independent validation
        - Mechanisms and national generalization
        - Cross-domain conflict-shock amplification estimates
        - Main conflict-by-shock estimates
      interpretation: >-
        Land NPP and observed nighttime activity support a local bounded null for differential
        rainfall sensitivity. National estimates do not establish broad amplification, and the
        mechanism family is not multiplicity robust. The result cannot be transported to household,
        flood, price, or national populations without prospectively gated evidence.
