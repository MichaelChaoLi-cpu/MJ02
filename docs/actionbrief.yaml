tableDictionary:
  table_shock_specific_analytical_support:
    tableId: table_shock_specific_analytical_support
    tablePath: data/results/tables/Table_shock_specific_analytical_support.xlsx
    tableCaption: Shock-specific analytical support
    tableAim: Documents unequal exposure coverage for supporting national shock analyses.
    tableExplanation: Conflict and annual rainfall cover all released observations, SPI-12 covers about 84 percent, wholesale price change about 50 percent, broad retail price change about 17-18 percent, and satellite inundation only supported survey waves.
    tableSuitableSection: Supplementary methods and data support
  table_main_historical_conflict_by_shock_interaction_estimates:
    tableId: table_main_historical_conflict_by_shock_interaction_estimates
    tablePath: data/results/tables/Table_main_historical_conflict_by_shock_interaction_estimates.xlsx
    tableCaption: Main conflict-by-shock estimates
    tableAim: Reports supporting national interaction estimates across agriculture, consumption, food security, and education.
    tableExplanation: Most drought, extreme-wet, and price interactions are imprecise. The main exception is an adverse school-attendance response to local rice-price shocks under the primary bombing-density and price definitions.
    tableSuitableSection: Supplementary national results
  table_alternative_conflict_measures_and_shock_definitions:
    tableId: table_alternative_conflict_measures_and_shock_definitions
    tablePath: data/results/tables/Table_alternative_conflict_measures_and_shock_definitions.xlsx
    tableCaption: Alternative conflict and shock definitions
    tableAim: Tests dependence on conflict measures, climate windows, price constructions, linkage scope, weights, and satellite measures.
    tableExplanation: The adverse school-attendance result survives the primary construction's broader robustness checks but is not stable across alternative bombing, prison, burial-site, wholesale, and broad-retail definitions.
    tableSuitableSection: Robustness appendix
  table_inference_and_multiplicity_checks:
    tableId: table_inference_and_multiplicity_checks
    tablePath: data/results/tables/Table_inference_and_multiplicity_checks.xlsx
    tableCaption: Inference and multiplicity checks
    tableAim: Reports geography clustering, Spatial-HAC, province wild bootstrap, and within-family Holm adjustments.
    tableExplanation: The primary-definition attendance estimate remains precise under the main inference suite, whereas the expanded six-test mechanism family gives parcel irrigation a Holm-adjusted p-value of 0.106 and no mechanism is multiplicity robust.
    tableSuitableSection: Inference appendix
  table_falsification_and_functional_form_checks:
    tableId: table_falsification_and_functional_form_checks
    tablePath: data/results/tables/Table_falsification_and_functional_form_checks.xlsx
    tableCaption: Falsification and functional-form checks
    tableAim: Tests future-shock placebos, nonlinear estimators, and alternative fixed-effect structures.
    tableExplanation: Placebo and functional-form checks do not overturn the primary attendance result, but they do not resolve its instability across alternative conflict and price definitions.
    tableSuitableSection: Robustness appendix
  table_historical_boundary_linkage_and_power_feasibility:
    tableId: table_historical_boundary_linkage_and_power_feasibility
    tablePath: data/results/tables/Table_historical_boundary_linkage_and_power_feasibility.xlsx
    tableCaption: Historical boundary linkage and power
    tableAim: Establishes reproduction, local support, effective power, SESOI, and the mandatory confirmation safeguard.
    tableExplanation: Historical assignment and distance reproduce exactly; the frozen 5 km primary and within-modern-commune confirmation designs have 80 percent MDEs below the 0.20-SD threshold.
    tableSuitableSection: Main methods and identification
  table_geographic_rd_identification_and_falsification_checks:
    tableId: table_geographic_rd_identification_and_falsification_checks
    tablePath: data/results/tables/Table_geographic_rd_identification_and_falsification_checks.xlsx
    tableCaption: Geographic identification and falsification checks
    tableAim: Reports continuity, density, distance-trend, bandwidth, placebo, road, and segment diagnostics.
    tableExplanation: No multiplicity-adjusted predetermined discontinuity stops the design; river distance is reviewed, modern commune proximity requires confirmation, and segment checks preserve the bounded-null conclusion.
    tableSuitableSection: Supplementary identification checks
  table_historical_boundary_shock_response_estimates:
    tableId: table_historical_boundary_shock_response_estimates
    tablePath: data/results/tables/Table_historical_boundary_shock_response_estimates.xlsx
    tableCaption: Historical boundary rainfall-response estimates
    tableAim: Reports the central land-NPP rainfall-sensitivity estimates and frozen robustness specifications.
    tableExplanation: Primary and mandatory confirmation estimates are small, mutually compatible, and have standardized confidence intervals inside the pre-specified 0.20-SD equivalence bounds.
    tableSuitableSection: Main results
  table_nighttime_activity_independent_validation_estimates:
    tableId: table_nighttime_activity_independent_validation_estimates
    tablePath: data/results/tables/Table_nighttime_activity_independent_validation_estimates.xlsx
    tableCaption: Nighttime activity validation estimates
    tableAim: Reports the compatible local rainfall-sensitivity estimand across frozen VIIRS specifications.
    tableExplanation: Primary and within-modern-commune estimates are substantively bounded nulls across outcome, coverage, weighting, rainfall, and bandwidth checks.
    tableSuitableSection: Supplementary validation estimates
  table_mechanism_families_and_multiplicity_checks:
    tableId: table_mechanism_families_and_multiplicity_checks
    tablePath: data/results/tables/Table_mechanism_families_and_multiplicity_checks.xlsx
    tableCaption: Mechanism families and multiplicity checks
    tableAim: Reports six activated mechanism tests, weighting sensitivities, and transparent deferrals.
    tableExplanation: Village infrastructure estimates are small, parcel irrigation is directionally coherent with Holm p=0.106, and no activated mechanism survives the six-test adjustment.
    tableSuitableSection: Supplementary mechanisms
  table_prospective_analysis_decisions_and_deviations:
    tableId: table_prospective_analysis_decisions_and_deviations
    tablePath: data/results/tables/Table_prospective_analysis_decisions_and_deviations.xlsx
    tableCaption: Prospective decisions and deviations
    tableAim: Preserves the dated hierarchy, source, support, SESOI, inference, validation, and mechanism decisions.
    tableExplanation: The contract separates outcome-blind design choices from post-estimation reporting changes and records the six-test mechanism-family harmonization.
    tableSuitableSection: Supplementary analysis contract

