    observationNumber: 1359
  historical_boundary_common_support:
    variableNameInDataset: Historical-Boundary Common Support
    variableNameInArticle: Five-kilometre historical-boundary common support
    variableAttribute: boolean
    variableUnit: indicator
    variableDescription: Marks eligible locations within the frozen 5 km primary bandwidth; fixed alternative bandwidths are retained for sensitivity.
    variableSource: historical_repression_boundary_replication
    observationNumber: 1359
  annual_land_npp_mean_kg_c_per_m2:
    variableNameInDataset: Annual Land NPP Mean kg C per m2
    variableNameInArticle: Annual local land net primary production
    variableAttribute: continuous
    variableUnit: kilograms carbon per square metre
    variableDescription: Annual mean valid land NPP within one kilometre of each historical village.
    variableSource: modis_land_npp_boundary_panel
    observationNumber: 4398
  annual_land_npp_anomaly_kg_c_per_m2:
    variableNameInDataset: Annual Land NPP Anomaly kg C per m2
    variableNameInArticle: Annual local land net primary production anomaly
    variableAttribute: continuous
    variableUnit: kilograms carbon per square metre
    variableDescription: Primary outcome formed by subtracting each village's fixed 2001-2020 NPP mean.
    variableSource: modis_land_npp_boundary_panel
    observationNumber: 4398
  annual_land_npp_anomaly_z_2001_2020:
    variableNameInDataset: Annual Land NPP Anomaly Z 2001-2020
    variableNameInArticle: Standardized annual local land NPP anomaly
    variableAttribute: continuous
    variableUnit: within-village standard deviations
    variableDescription: NPP anomaly divided by the village-specific 2001-2020 standard deviation for equivalence assessment.
    variableSource: modis_land_npp_boundary_panel
    observationNumber: 4398
