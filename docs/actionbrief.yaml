analysisStructureBrief:
  overview: Two linked but separately estimated stages evaluate climate constraints on annual cropland productivity and the household economic relevance of prior-year local productivity. National estimates provide a modest benchmark, while frozen outcome-blind regions reveal where ecological sensitivity and food-consumption relevance are jointly concentrated. The synthesis yields a transparent regional priority typology without multiplying the two coefficients.
  levels:
    - levelName: Measurement and analytical support
      levelAim: Establish transparent spatial linkage, timing, exposure support, NPP quality, consumption harmonisation, and complete-case gates.
      inputs:
        - CSES Public-Point Linkage
        - Interview Calendar Year
        - Prior NPP Calendar Year
        - NPP Pixel Support
        - Prior-Year NPP Pixel Support
        - Stage-2 Complete-Case Flags
      modelOrMethod: Deterministic village linkage, calendar-year alignment, buffer extraction, valid-pixel quality gates, recall-period annualisation, CPI deflation, and complete-case accounting precede all estimation.
      outputs:
        - Research Design Data Linkage and Analytical Support
        - Analytical Samples and Variable Definitions
        - Consumption Harmonisation by Survey Wave
        - Household Linkage and Missingness by Survey Wave
      interpretation: These outputs establish observable data support and attrition. They do not estimate climate, ecological, or welfare effects.
    - levelName: National climate-to-NPP estimation
      levelAim: Estimate within-village annual associations between climate exposure and strict-cropland NPP.
      inputs:
        - Annual Heat Days at or Above 35 C
        - Annual Heat Degree-Days Above 35 C
        - Annual Maximum Consecutive Five-Day Precipitation Rx5day
        - Annual Maximum Consecutive Dry Days Below 1 mm
        - Annual Precipitation Total
        - Annual Strict-Cropland Mean NPP
      modelOrMethod: |-
        The primary model is \[NPP_{vt}=\alpha_v+\lambda_t+\beta_1 Heat35Days_{vt}+\beta_2 Rx5day_{vt}+\beta_3 DrySpell_{vt}+\beta_4 RainTotal_{vt}+\epsilon_{vt}.\] Village fixed effects \(\alpha_v\) remove persistent location differences and year fixed effects \(\lambda_t\) absorb national annual shocks. The alternative heat model replaces \(Heat35Days_{vt}\) with heat degree-days above 35 C.
      outputs:
        - National Climate-to-NPP Responses
        - National Climate-to-NPP Regression Results
      interpretation: Coefficients describe conditional within-village climate-NPP associations in natural units. They do not identify crop yield losses or eliminate time-varying local confounding.
    - levelName: Stage-1 robustness and spatial uncertainty
      levelAim: Determine whether climate-NPP conclusions survive declared measurement, functional-form, support, and covariance alternatives.
      inputs:
        - Annual Inclusive-Agriculture Mean NPP
        - NPP Pixel Support
        - Mean Annual Strict-Cropland NPP Filled-Days Percentage
        - Annual Precipitation Total
        - Annual Maximum Consecutive Five-Day Precipitation Rx5day
        - Annual Heat Degree-Days Above 35 C
        - Annual Maximum Consecutive Dry Days Below 1 mm
      modelOrMethod: The national fixed-effect model is repeated after omitting annual rainfall, replacing it with its village-and-year residual after Rx5day adjustment, adding the continuous NPP filled-days percentage, and restricting the sample to the pooled lower 75 and lower 50 percent of that measure. Additional checks use 2 and 10 km buffers, strict and inclusive land cover, valid-pixel gates, quadratic response, degree-day heat intensity, village-year and spatial-block clustering, and same-year Bartlett Conley spatial HAC with 25, 50, and 100 km cutoffs; leave-one-year estimates assess temporal influence.
      outputs:
        - Climate-to-NPP Robustness Coefficients
        - Climate-to-NPP Robustness Results
      interpretation: The maximum-dry-spell association remains negative and precise across rainfall omission, residual-rainfall adjustment, continuous NPP-quality adjustment, both pooled quality-support restrictions, and all Conley cutoffs. The heat direction is negative but sensitive to intensity definition, spatial uncertainty, and omitted years, so dry-spell persistence is the reproducible national constraint.
    - levelName: Outcome-blind regional heterogeneity
      levelAim: Test discrete spatial differences without selecting regions from outcome coefficients.
      inputs:
        - Village Spatial Adjacency
        - SKATER Region ID
        - Annual Strict-Cropland Mean NPP
        - Prior-Year Strict-Cropland NPP
        - Real 2021 Annual Total Consumption per Capita
        - Real 2021 Annual Food Consumption per Capita
      modelOrMethod: |-
        For focal exposure \(Z_i\) and frozen region \(k\), estimate \[Y_i=FE_i+W_i'\delta+\sum_{k=1}^{6}\mu_kR_{ik}+\sum_{k=1}^{6}\phi_k Z_iR_{ik}+u_i.\] The joint test \(H_0:\phi_1=\cdots=\phi_6\) is evaluated before individual regional slopes. Regions were created from standardized predetermined features only.
      outputs:
        - Outcome-Blind Regions and Zonal Climate-to-NPP Responses
        - Regional Climate-to-NPP Regression Results
        - Regional NPP-to-Consumption Regression Results
      interpretation: Rejected joint equality tests establish substantial regional heterogeneity on the frozen partition. The observed dry-spell P10-to-P90 contrast corresponds to a 1.46 percent national NPP decline but 2.64 percent in the lower Mekong and southeastern plains (R4) and 3.76 percent in the southern coastal belt (R6).
    - levelName: National NPP-to-consumption estimation
      levelAim: Estimate whether prior-year local cropland productivity is conditionally associated with household consumption.
      inputs:
        - Prior-Year Strict-Cropland NPP
        - Real 2021 Annual Total Consumption per Capita
        - Real 2021 Annual Food Consumption per Capita
        - Household Composition Vector
        - Household Survey Weight
        - Consumption Instrument Regime
      modelOrMethod: |-
        The primary repeated-cross-section model is \[\ln C_{hvt}=\lambda_s+\theta NPP_{v,t-1}+X_{hvt}'\gamma+\epsilon_{hvt}.\] Here \(C_{hvt}\) is real per-capita total or food consumption, \(\lambda_s\) denotes exact survey-time effects, \(NPP_{v,t-1}\) is prior-year strict-cropland NPP, and \(X_{hvt}\) is the household-composition vector. Estimation uses household survey weights and village-clustered uncertainty.
      outputs:
        - Cropland NPP and Household Consumption
        - National NPP-to-Consumption Regression Results
        - NPP-to-Consumption Robustness Results
      interpretation: In the composition-adjusted model, a 0.1 kg C per m2 increase in prior-year NPP is associated with 2.29 percent higher total consumption and 2.81 percent higher food consumption. With socioeconomic adjustment, the food estimate remains positive and precise at 2.13 percent, whereas the broader total-consumption benchmark attenuates to 1.45 percent and becomes imprecise. Food consumption therefore carries the main household-relevance result.
    - levelName: Regional ecological-economic priority synthesis
      levelAim: Identify regions where above-national dry-spell sensitivity coincides with robust household food-consumption relevance.
      inputs:
        - SKATER Region ID
        - Annual Maximum Consecutive Dry Days Below 1 mm
        - Annual Strict-Cropland Mean NPP
        - Prior-Year Strict-Cropland NPP
        - Real 2021 Annual Food Consumption per Capita
        - Household Composition Vector
        - Socioeconomic Control Vector
        - Household Survey Weight
      modelOrMethod: Apply the pooled P10-to-P90 dry-spell contrast to each common-model regional dry-spell slope and express the result in kg C per ha and percent of regional mean NPP. Estimate expanded-control regional food-consumption slopes in one survey-weighted interaction model. A region is jointly elevated when both point estimates exceed their national magnitudes and both 95 percent intervals exclude zero; the two dimensions remain separate.
      outputs:
        - Regional Dry-Spell Sensitivity and Food-Consumption Relevance
        - Regional Ecological-Economic Priority Evidence
      interpretation: The lower Mekong and southeastern plains (R4) combine a 2.64 percent NPP decline with a 6.40 percent food-consumption difference, and the southern coastal belt (R6) combines 3.76 percent with 3.35 percent. Both satisfy the fixed jointly elevated rule, identifying priority regions for targeted monitoring and locally tailored agricultural assessment. The northern-northwestern interior and northern Tonle Sap arc (R1) is household-relevance-only and the south-central interior plains (R5) is discordant, showing why one national ranking would misallocate attention.
    - levelName: Continuous spatial heterogeneity
      levelAim: Assess whether regional contrasts correspond to smooth local coefficient variation with adequate information.
      inputs:
        - Annual Heat Days at or Above 35 C
        - Annual Maximum Consecutive Dry Days Below 1 mm
        - Annual Strict-Cropland Mean NPP
        - Prior-Year Strict-Cropland NPP
        - Real 2021 Annual Total Consumption per Capita
        - Real 2021 Annual Food Consumption per Capita
        - Household Survey Weight
      modelOrMethod: |-
        After global residualisation, estimate at target location \(s_0\): \[\widehat{\psi}(s_0)=\arg\min_{\psi}\sum_i q_i w[d(s_i,s_0);b(s_0)](\widetilde{Y}_i-\widetilde{W}_i'\psi)^2.\] Adaptive neighbour bandwidth \(b(s_0)\) is selected by AICc without reference to coefficient significance; \(q_i\) is one in stage 1 and the survey weight in stage 2.
      outputs:
        - Continuous Spatial Heterogeneity
        - Continuous NPP-to-Consumption Spatial Diagnostics
        - GWR Bandwidth and Effective-Sample Diagnostics
        - GWR and Local-Regression Diagnostics
      interpretation: Stage-1 heat and dry-spell surfaces have large effective local samples and stable adjacent-bandwidth signs. Stage-2 surfaces have small effective samples and mostly zero-crossing intervals, so they remain diagnostic rather than pointwise findings.
    - levelName: Evidence synthesis
      levelAim: Integrate the two empirical stages into a constructive geographically differentiated monitoring result.
      inputs:
        - Annual Maximum Consecutive Dry Days Below 1 mm
        - Annual Strict-Cropland Mean NPP
        - Prior-Year Strict-Cropland NPP
        - Real 2021 Annual Total Consumption per Capita
        - Real 2021 Annual Food Consumption per Capita
      modelOrMethod: Compare the national dry-spell magnitude with translated regional magnitudes, declared rainfall and NPP-quality checks, frozen-region joint tests, expanded-control food-consumption slopes, and the fixed regional typology. Continuous surfaces provide supporting spatial context in the appendix.
      outputs:
        - Regional Dry-Spell Sensitivity and Food-Consumption Relevance
        - Regional Ecological-Economic Priority Evidence
        - Climate-to-NPP Robustness Results
      interpretation: "The national effect is modest but masks a several-fold concentration of ecological sensitivity in R4 and R6, where expanded-control food-consumption relevance is also positive and precise. This spatial mismatch is the actionable result: national-average targeting would overlook the regions with the strongest combined evidence."
