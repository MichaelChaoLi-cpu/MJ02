    figureAim: Assess whether continuous local coefficient surfaces have adequate spatial information.
    figureExplanation: Reports AICc bandwidth selection, leave-one-village-out prediction, effective local sample distributions, and locations with the weakest stage-2 support.
    figurePanelCount: 4
    figureNote: "Panel a displays AICc differences across adaptive-neighbor bandwidths for the two climate-NPP and two NPP-consumption local models. Panel b reports leave-one-village-out prediction error relative to each model-specific minimum. Panel c summarizes effective local sample-size distributions at the selected bandwidths. Panel d maps the minimum effective household sample across the two stage-2 local models to identify locations with the weakest support."
