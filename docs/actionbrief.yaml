    variableSource: historical_repression_boundary_replication
    observationNumber: 1359
  historical_boundary_segment:
    variableNameInDataset: Historical Boundary Segment
    variableNameInArticle: Historical boundary segment identifier
    variableAttribute: categorical
    variableUnit: five segment identifiers
    variableDescription: Nearest one of five historical boundary anchors used for local comparison and segment-by-year adjustment.
