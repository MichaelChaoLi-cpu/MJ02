    variableSource: outcome_blind_regions
    observationNumber: 2966

figureDictionary:
  fig_research_design_data_linkage_and_analytical_support:
    figureId: fig_research_design_data_linkage_and_analytical_support
    figurePath: data/results/figures/Figure_research_design_data_linkage_and_analytical_support.png
    figureCaption: Data linkage, temporal coverage, and analytical sample support
    figureAim: Document spatial linkage, time support, NPP scale coverage, and household sample attrition before coefficient interpretation.
    figureExplanation: Maps all NPP-supported public villages and consumption-complete locations, compares NPP linkage at three radii, aligns climate and NPP periods, and reports household complete-case counts.
    figurePanelCount: 4
    figureNote: "Panel a maps NPP-supported public villages and villages contributing to the primary total-consumption analysis. Panel b compares the share of outcome-eligible households with strict-cropland and inclusive-agriculture prior-year NPP at 2, 5, and 10 km. Panel c aligns the climate, NPP, and CSES observation periods. Panel d traces household retention from outcome eligibility through 5 km NPP linkage to the total- and food-consumption complete-case samples."
    figureSuitableSection: Methods and opening Results
  fig_national_geography_of_climate_exposure_and_cropland_npp:
    figureId: fig_national_geography_of_climate_exposure_and_cropland_npp
    figurePath: data/results/figures/Figure_national_geography_of_climate_exposure_and_cropland_npp.png
    figureCaption: National geography of climate exposure and cropland productivity
    figureAim: Establish the geographic variation underlying the national stage-1 model.
    figureExplanation: Maps average heat days, Rx5day, maximum dry-spell length, and strict-cropland NPP at linked public village points.
    figurePanelCount: 4
    figureNote: "Panel a maps mean annual days with maximum temperature at or above 35 degrees C. Panel b maps mean annual maximum five-day precipitation. Panel c maps mean annual maximum consecutive dry days below 1 mm. Panel d maps mean annual strict-cropland NPP. All panels use the national public-village support and display subnational boundaries and neighboring countries for geographic orientation."
    figureSuitableSection: Results
  fig_national_climate_to_npp_responses:
    figureId: fig_national_climate_to_npp_responses
    figurePath: data/results/figures/Figure_national_climate_to_npp_responses.png
    figureCaption: National climate associations with annual cropland productivity
    figureAim: Present the national fixed-effect climate-NPP estimates and flexible rainfall response.
    figureExplanation: Heat-day and degree-day specifications produce negative heat directions with different precision; maximum dry-spell length is negative and precise, while national Rx5day is near zero and non-monotonic.
    figurePanelCount: 3
    figureNote: "Panel a reports fully adjusted national climate-NPP coefficients from the primary heat-day specification. Panel b replaces heat days with degree-days above 35 degrees C while retaining the precipitation variables. Panel c shows the adjusted restricted-cubic-spline relationship between Rx5day and NPP relative to median Rx5day, with its confidence band, fixed knot locations, observed-support rug, and zero-reference line."
    figureSuitableSection: Results
  fig_outcome_blind_regions_and_zonal_climate_to_npp_responses:
    figureId: fig_outcome_blind_regions_and_zonal_climate_to_npp_responses
    figurePath: data/results/figures/Figure_outcome_blind_regions_and_zonal_climate_to_npp_responses.png
    figureCaption: Outcome-blind regions and regional climate-productivity slopes
    figureAim: Test whether national climate-NPP relationships differ across frozen contiguous regions.
    figureExplanation: Maps the six-region SKATER solution with code-plus-geography labels and reports region-specific heat, Rx5day, and dry-spell slopes with joint equality tests.
    figurePanelCount: 2
    figureNote: "Panel a maps the frozen six-region SKATER partition constructed only from predetermined geographic features and labels R1 north/northwest, R2 western Tonle Sap, R3 east/northeast Mekong, R4 lower Mekong/southeast, R5 south-central interior, and R6 southern coast. These are descriptive cluster labels rather than administrative units. Panel b reports region-specific heat-day, Rx5day, and maximum-dry-spell slopes on the common national sample, with confidence intervals, a zero-reference line, and the corresponding joint regional slope-equality tests."
    figureSuitableSection: Results
  fig_cropland_npp_and_household_consumption:
    figureId: fig_cropland_npp_and_household_consumption
    figurePath: data/results/figures/Figure_cropland_npp_and_household_consumption.png
    figureCaption: Cropland productivity and household consumption associations
    figureAim: Connect prior-year local ecological productivity to total and food consumption without claiming mediation.
    figureExplanation: National survey-weighted food estimates remain positive after socioeconomic adjustment, village-fixed-effect estimates are imprecise, and expanded-control regional slopes differ substantially.
    figurePanelCount: 4
    figureNote: "Panel a presents the national specification ladder for total consumption. Panel b presents the corresponding ladder for food consumption. Panels c and d report expanded-control region-specific prior-year NPP slopes for total and food consumption, respectively, with confidence intervals, zero-reference lines, and joint regional slope-equality tests. All effect scales are percent differences in consumption per 0.1 kg C m-2 higher NPP."
    figureSuitableSection: Results
  fig_regional_dry_spell_sensitivity_and_food_consumption_relevance:
    figureId: fig_regional_dry_spell_sensitivity_and_food_consumption_relevance
    figurePath: data/results/figures/Figure_regional_dry_spell_sensitivity_and_food_consumption_relevance.png
    figureCaption: Regional ecological sensitivity and food-consumption relevance
    figureAim: Identify regions where dry-spell sensitivity and household food-consumption relevance are jointly elevated.
    figureExplanation: Compares each region's NPP decline over the pooled dry-spell P10-to-P90 contrast with its expanded-control food-consumption difference per 0.1 kg C per m2 NPP; national estimates provide fixed reference lines and confidence intervals show uncertainty in both dimensions.
    figurePanelCount: 1
    figureSuitableSection: Results
  fig_continuous_spatial_heterogeneity:
    figureId: fig_continuous_spatial_heterogeneity
    figurePath: data/results/figures/Figure_continuous_spatial_heterogeneity.png
    figureCaption: Continuous spatial heterogeneity in climate-productivity relationships
    figureAim: Determine whether frozen regional differences correspond to continuous ecological spatial structure.
    figureExplanation: Maps local heat-day and dry-spell slopes after global adjustment; adjacent-bandwidth signs are stable for most villages, but local coefficients remain descriptive associations.
    figurePanelCount: 2
    figureNote: "Panel a maps geographically weighted local heat-day slopes for cropland NPP after adjustment for the remaining climate covariates. Panel b maps corresponding local maximum-dry-spell slopes. Both panels show village-level coefficient surfaces on common geographic context, with color scales expressed as NPP change per 10 exposure units."
    figureSuitableSection: Supplementary Results
  fig_climate_shock_distributions_and_correlations:
    figureId: fig_climate_shock_distributions_and_correlations
    figurePath: data/results/figures/Figure_climate_shock_distributions_and_correlations.png
    figureCaption: Distributions and correlations of annual climate exposures
    figureAim: Document natural-unit support and dependence among the stage-1 exposures.
    figureExplanation: Shows the close heat-day and degree-day relationship, right-skewed rainfall extremes, dry-spell distribution, annual rainfall distribution, and pairwise correlations.
    figurePanelCount: 5
    figureNote: "Panel a shows the joint distribution of annual heat days and degree-days above 35 degrees C. Panels b, c, and d show village-year distributions of Rx5day, maximum consecutive dry days, and annual precipitation, with medians marked. Panel e reports Pearson correlations among the two heat measures, Rx5day, maximum dry-spell length, and annual precipitation."
    figureSuitableSection: Supplementary Methods
  fig_cropland_definition_and_npp_quality_support:
    figureId: fig_cropland_definition_and_npp_quality_support
    figurePath: data/results/figures/Figure_cropland_definition_and_npp_quality_support.png
    figureCaption: Cropland definitions and annual NPP pixel support
    figureAim: Demonstrate that the ecological outcome is supported across land-cover definitions and locations.
    figureExplanation: Maps pixels added by the inclusive definition, reports valid-pixel support, and shows close agreement between strict and inclusive annual NPP.
    figurePanelCount: 3
    figureNote: "Panel a maps the mean number of additional candidate NPP pixels contributed by the inclusive-agriculture definition relative to strict cropland. Panel b compares annual valid-pixel-share distributions for the two definitions and marks the 80 percent support threshold. Panel c shows village-year agreement between strict-cropland and inclusive-agriculture annual NPP, with the one-to-one line and observation density."
    figureSuitableSection: Supplementary Methods
  fig_climate_to_npp_robustness_coefficients:
    figureId: fig_climate_to_npp_robustness_coefficients
    figurePath: data/results/figures/Figure_climate_to_npp_robustness_coefficients.png
    figureCaption: Climate-productivity estimates across robustness specifications
    figureAim: Evaluate rainfall handling, NPP quality, measurement, functional-form, sample-support, and spatial-inference sensitivity in stage 1.
    figureExplanation: Dry-spell estimates remain negative after omitting or residualising annual rainfall, continuously adjusting for gap filling, restricting NPP-quality support, changing buffers and land-cover definitions, and applying spatial uncertainty estimators.
    figurePanelCount: 4
    figureNote: "Panels a, b, c, and d compare robustness estimates for heat exposure, Rx5day, maximum dry-spell length, and annual rainfall, respectively. Each panel contrasts the primary 5 km strict-cropland estimate with alternative buffer radii, the inclusive-agriculture definition, valid-pixel support gates, nonlinear or alternative-heat specifications, and alternative clustering or spatial-HAC inference. Points are coefficient estimates and lines are confidence intervals."
    figureSuitableSection: Supplementary Results
  fig_household_linkage_and_consumption_support_by_wave:
    figureId: fig_household_linkage_and_consumption_support_by_wave
    figurePath: data/results/figures/Figure_household_linkage_and_consumption_support_by_wave.png
    figureCaption: Household linkage and consumption support across survey waves
    figureAim: Make stage-2 survey linkage, timing, retention, and instrument changes transparent.
    figureExplanation: Compares released and matched households, complete-case retention, exact interview-to-NPP timing, and analytical counts by questionnaire regime.
    figurePanelCount: 4
