  stage2_complete_case_flags:
    variableNameInDataset: Stage 2 Total Consumption Complete Case; Stage 2 Food Consumption Complete Case; Stage 2 Common Outcome Complete Case; Stage 2 Expanded Socioeconomic Complete Case
    variableNameInArticle: Stage-2 Complete-Case Flags
