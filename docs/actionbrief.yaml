    figureId: fig_continuous_npp_to_consumption_spatial_diagnostics
    figurePath: data/results/figures/Figure_continuous_npp_to_consumption_spatial_diagnostics.png
    figureCaption: Local NPP-consumption surfaces as spatial diagnostics
    figureAim: Display possible continuous stage-2 heterogeneity without presenting pointwise causal findings.
    figureExplanation: Total- and food-consumption local slopes vary geographically, but small effective samples and mostly zero-crossing intervals make the maps diagnostic only.
