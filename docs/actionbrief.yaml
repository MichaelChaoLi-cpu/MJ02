doc_type: actionbrief
version: 1.0.0

datasetDictionary:
  daily_climate_sources:
    datasetSourceName: CHIRTS-ERA5 daily maximum temperature and CHIRPS daily precipitation
    datasetDescription: Daily gridded temperature and precipitation inputs used to construct absolute annual heat and rainfall exposures.
    datasetAttribute: raster
    datasetProvider: Climate Hazards Center and CHIRTS-ERA5 data providers
    datasetGenerationInfo: Source grids were clipped to Cambodia, aligned to the national climate grid, and retained without spatial or temporal imputation.
    datasetPeriod: 1991-2024
    datasetScale: Cambodia national coverage
    datasetSpatialResolution: approximately 0.05 degree climate cells
    datasetTemporalResolution: daily
    datasetPreprocessingInfo: Daily valid-value gates were applied before annual aggregation; included-cell and valid-day counts were retained.
  annual_absolute_climate_shocks:
    datasetSourceName: Cambodia national annual absolute climate shocks
    datasetDescription: Derived annual heat-day, heat-intensity, extreme-rainfall, dry-spell, and rainfall-total panel.
    datasetAttribute: table
    datasetProvider: Project-generated from daily climate sources
    datasetGenerationInfo: Daily observations were aggregated by climate cell and calendar year using absolute thresholds and rolling precipitation definitions.
    datasetPeriod: 1991-2024
    datasetScale: 212568 climate-cell-year records across 6252 cells
    datasetSpatialResolution: approximately 0.05 degree climate cells
    datasetTemporalResolution: annual from daily inputs
    datasetPreprocessingInfo: Heat days use daily maximum temperature at or above 35 C; dry days use precipitation below 1 mm; no exposure is standardized.
  village_buffer_climate_panel:
    datasetSourceName: CSES village-buffer annual climate panel
    datasetDescription: Annual climate exposures assigned to mapped village-centred buffers at three radii.
    datasetAttribute: table
    datasetProvider: Project-generated from annual climate shocks and village-buffer grid crosswalks
    datasetGenerationInfo: Climate-cell exposures were averaged over included one-kilometre grid cells within 2, 5, and 10 km village buffers.
    datasetPeriod: 1991-2024
    datasetScale: 302838 village-buffer-year records
    datasetSpatialResolution: village-centred 2, 5, and 10 km buffers
    datasetTemporalResolution: annual
    datasetPreprocessingInfo: The panel retains climate-cell support and valid-day information; 5 km is primary and 2 km and 10 km are sensitivities.
  annual_cropland_npp_panel:
    datasetSourceName: MODIS annual cropland NPP village-buffer panel
    datasetDescription: Native-pixel annual cropland NPP and quality support around national public village points.
    datasetAttribute: table
    datasetProvider: NASA LP DAAC MOD17A3HGF.061 and MCD12Q1.061
    datasetGenerationInfo: Valid 500 m annual NPP pixel centres were intersected with same-year strict-cropland and inclusive-agriculture land-cover classes.
    datasetPeriod: 2001-2021
    datasetScale: 186858 point-buffer-year records for 2966 public village points
    datasetSpatialResolution: native 500 m pixels summarized within 2, 5, and 10 km buffers
    datasetTemporalResolution: annual
    datasetPreprocessingInfo: NPP uses the 0.0001 scale factor; original quality values above 100 were recoded to zero and separately counted.
  stage1_analysis_panel:
    datasetSourceName: Climate-cropland-NPP village panel
    datasetDescription: Five-kilometre village-year panel joining annual climate exposures to cropland NPP.
    datasetAttribute: table
    datasetProvider: Project-generated analytical release
    datasetGenerationInfo: Unique national public village points were joined by calendar year to the 5 km climate and cropland-NPP panels.
    datasetPeriod: 2001-2021
    datasetScale: 62286 village-year records; 59135 strict-cropland complete cases
    datasetSpatialResolution: 5 km public-village-point buffers
    datasetTemporalResolution: annual
    datasetPreprocessingInfo: Duplicate codes sharing a physical point were collapsed; complete-case flags and NPP pixel-support measures were materialized.
  cses_consumption_release:
    datasetSourceName: Cambodia Socio-Economic Survey consumption release
    datasetDescription: Harmonized household food, non-food, housing, education, price, demographic, and survey-weight information.
    datasetAttribute: table
    datasetProvider: National Institute of Statistics of Cambodia
    datasetGenerationInfo: Released CSES modules were harmonized across questionnaire regimes and recall periods, then converted to annual per-capita measures.
    datasetPeriod: survey waves from 2004-2021
    datasetScale: 77904 household-wave records
    datasetSpatialResolution: household records with public village-point linkage where available
    datasetTemporalResolution: repeated survey waves with interview month and year
    datasetPreprocessingInfo: Monetary outcomes were deflated to 2021 riels; no monetary outcome was winsorized and missing item values were not routinely imputed.
  stage2_household_npp_release:
    datasetSourceName: Interview-aligned household cropland-NPP analysis release
    datasetDescription: CSES household outcomes linked to the most recent completed annual cropland NPP observation.
    datasetAttribute: table
    datasetProvider: Project-generated from CSES, CPI, public village points, and MODIS NPP
    datasetGenerationInfo: Prior NPP year equals actual interview calendar year minus one; NPP was linked at 2, 5, and 10 km under two land-cover definitions.
    datasetPeriod: 2007-2021 main analysis; 2004 diagnostic only
    datasetScale: 77904 released records; 43120 total-consumption and 43365 food-consumption complete cases
    datasetSpatialResolution: households linked to national public village points and village-centred buffers
    datasetTemporalResolution: household-wave with exact interview timing
    datasetPreprocessingInfo: Survey weights, household controls, NPP support, instrument regimes, and reproducible complete-case flags were retained.
  outcome_blind_regions:
    datasetSourceName: Frozen outcome-blind spatial regions
    datasetDescription: Six contiguous SKATER regions and predetermined geographic context for national public village points, with descriptive geographic labels that do not redefine the analytical boundaries.
    datasetAttribute: table
    datasetProvider: Project-generated from terrain, long-run climate, cropland, population, and historical road context
    datasetGenerationInfo: Standardized predetermined features and a symmetric village-neighbour graph were used to compare four through seven SKATER and REDCAP candidates before outcome estimation.
    datasetPeriod: baseline or long-run context; frozen in 2026
    datasetScale: 2966 national public village points
    datasetSpatialResolution: public village point and spatial-neighbour graph
    datasetTemporalResolution: time-invariant frozen assignment
    datasetPreprocessingInfo: The selected six-region SKATER solution excludes NPP, consumption, residuals, coefficient signs, and p-values and passes all support gates.

variableDictionary:
  annual_heat_days_35c:
    variableNameInDataset: Village Buffer Mean Annual Heat Days at or Above 35 C
    variableNameInArticle: Annual Heat Days at or Above 35 C
    variableAttribute: count
    variableUnit: days per year
    variableDescription: Count of calendar days with daily maximum temperature at or above 35 C, reported per 10 days.
    variableSource: stage1_analysis_panel
    observationNumber: 62286
  annual_heat_degree_days_35c:
    variableNameInDataset: Village Buffer Mean Annual Heat Degree-Days Above 35 C
    variableNameInArticle: Annual Heat Degree-Days Above 35 C
    variableAttribute: continuous
    variableUnit: degree-C days per year
    variableDescription: Sum of daily maximum temperature exceedance above 35 C, reported per 10 degree-days and estimated separately from heat-day count.
    variableSource: stage1_analysis_panel
    observationNumber: 62286
  annual_rx5day:
    variableNameInDataset: Village Buffer Mean Annual Maximum Consecutive Five-Day Precipitation Rx5day mm
    variableNameInArticle: Annual Maximum Consecutive Five-Day Precipitation Rx5day
    variableAttribute: continuous
    variableUnit: mm
    variableDescription: Largest rolling precipitation total over five consecutive calendar days, reported per 10 mm.
    variableSource: stage1_analysis_panel
    observationNumber: 62286
  annual_maximum_dry_spell:
    variableNameInDataset: Village Buffer Mean Annual Maximum Consecutive Dry Days Below 1 mm
    variableNameInArticle: Annual Maximum Consecutive Dry Days Below 1 mm
    variableAttribute: count
    variableUnit: days
    variableDescription: Longest annual run of days with precipitation below 1 mm, reported per 10 days.
    variableSource: stage1_analysis_panel
    observationNumber: 62286
  annual_precipitation_total:
    variableNameInDataset: Village Buffer Mean Annual Precipitation Total mm
    variableNameInArticle: Annual Precipitation Total
    variableAttribute: continuous
    variableUnit: mm per year
    variableDescription: Calendar-year precipitation sum, reported per 100 mm to separate rainfall quantity from temporal structure.
    variableSource: stage1_analysis_panel
    observationNumber: 62286
  annual_strict_cropland_npp:
    variableNameInDataset: Annual Strict-Cropland Mean NPP kg C per m2
    variableNameInArticle: Annual Strict-Cropland Mean NPP
    variableAttribute: continuous
    variableUnit: kg C per m2 per year
    variableDescription: Mean valid annual MODIS NPP among same-year strict-cropland pixels within the village buffer.
    variableSource: stage1_analysis_panel
    observationNumber: 59135
  annual_inclusive_agriculture_npp:
    variableNameInDataset: Annual Inclusive-Agriculture Mean NPP kg C per m2
    variableNameInArticle: Annual Inclusive-Agriculture Mean NPP
    variableAttribute: continuous
    variableUnit: kg C per m2 per year
    variableDescription: Mean valid annual MODIS NPP including cropland-natural vegetation mosaics.
    variableSource: stage1_analysis_panel
    observationNumber: 59241
  npp_pixel_support:
    variableNameInDataset: Strict-Cropland Candidate 500m Pixel Count; Strict-Cropland Valid NPP 500m Pixel Count; Strict-Cropland Valid NPP Pixel Share; Strict-Cropland Original NPP QC Above 100 Pixel Count
    variableNameInArticle: NPP Pixel Support
    variableAttribute: other
    variableUnit: pixel count and share
    variableDescription: Candidate, valid, valid-share, and recoded quality-control diagnostics for annual NPP extraction.
    variableSource: stage1_analysis_panel
    observationNumber: 62286
  annual_strict_cropland_npp_filled_days_percentage:
    variableNameInDataset: Mean Strict-Cropland Recoded NPP QC Filled Days Percent
    variableNameInArticle: Mean Annual Strict-Cropland NPP Filled-Days Percentage
    variableAttribute: continuous
    variableUnit: percent
    variableDescription: Mean percentage of growing-season days supported by gap-filled FPAR or LAI inputs for annual strict-cropland NPP pixels; used for continuous adjustment and pooled lower-75-percent and lower-50-percent quality-support checks.
    variableSource: stage1_analysis_panel
    observationNumber: 59135
  real_total_consumption_per_capita:
    variableNameInDataset: Real 2021 Annual Total Consumption per Capita Riels
    variableNameInArticle: Real 2021 Annual Total Consumption per Capita
    variableAttribute: continuous
    variableUnit: 2021 riels per person per year
    variableDescription: Annualized food, non-food, housing, and applicable education consumption divided by household size; logarithm used in regressions.
    variableSource: stage2_household_npp_release
    observationNumber: 62526
  real_food_consumption_per_capita:
    variableNameInDataset: Real 2021 Annual Food Consumption per Capita Riels
