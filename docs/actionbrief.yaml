  signed_distance_to_historical_repression_boundary_km:
    variableNameInDataset: Signed Distance to Historical Repression Boundary km
    variableNameInArticle: Signed distance to the Southwest-West historical boundary
    variableAttribute: continuous
    variableUnit: kilometres
